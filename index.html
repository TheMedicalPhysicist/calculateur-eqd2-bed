<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Calculateur EQD2 / BED</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working column. α/β strip on top, three tabs (conversion, cumul, comparaison), one panel each. */
:root {
  --bg: #f2f5f8;
  --surface: #ffffff;
  --ink: #0e1a26;
  --ink2: #44566a;
  --muted: #5d6c7b;
  --line: #dbe3ea;
  --edge: #b9c6d2;
  --accent: #256abf;
  --accent-ink: #ffffff;
  --accent-wash: #e6effa;
  --warn: #8a4f00;
  --warn-wash: #fdf1dc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --display: 'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1119; --surface: #121c27; --ink: #eaf1f7; --ink2: #b4c1ce; --muted: #8fa0b0;
    --line: #243241; --edge: #3a4b5d; --accent: #6da7ec; --accent-ink: #0a1119; --accent-wash: #16283b;
    --warn: #f0b45a; --warn-wash: #2c2210;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1119; --surface: #121c27; --ink: #eaf1f7; --ink2: #b4c1ce; --muted: #8fa0b0;
  --line: #243241; --edge: #3a4b5d; --accent: #6da7ec; --accent-ink: #0a1119; --accent-wash: #16283b;
  --warn: #f0b45a; --warn-wash: #2c2210;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--sans);
  padding-inline: 16px; padding-block: 28px 56px;
}
.wrap { max-width: 1040px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
.wrap > * { min-width: 0; }

header h1 {
  font: 600 clamp(1.9rem, 4.5vw, 2.7rem)/1.05 var(--display);
  letter-spacing: -0.01em; margin: 6px 0 8px; text-wrap: balance;
}
.eyebrow { font: 500 11.5px/1 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.formulas { display: flex; flex-wrap: wrap; gap: 6px 22px; font: 400 13px/1.5 var(--mono); color: var(--ink2); }
.formulas b { font-weight: 500; color: var(--ink); }

/* α/β strip */
.abstrip { display: grid; grid-template-columns: auto 1fr; gap: 12px 24px; align-items: end; padding-block: 16px; border-block: 1px solid var(--line); }
.abstrip .hint { grid-column: 1 / -1; color: var(--muted); font-size: 13px; margin: 0; }
@media (max-width: 640px) { .abstrip { grid-template-columns: minmax(0, 1fr); } }
.abfield label, .f label { display: block; font: 500 12px/1.3 var(--sans); color: var(--ink2); margin-bottom: 5px; }
.abfields { display: flex; flex-wrap: wrap; gap: 12px 16px; }
.abfield .in { width: 120px; font-size: 22px; }
.abfield.u .in { width: 96px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: 500 13px/1 var(--sans); padding: 9px 12px; border-radius: 6px; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1px solid var(--edge);
}
.chip .v { font-family: var(--mono); color: var(--ink2); margin-left: 6px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip[aria-pressed="true"] .v { color: inherit; }

/* inputs */
.in {
  width: 100%; font: 500 16px/1.2 var(--mono); padding: 9px 10px; border-radius: 6px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--edge);
}
.in.txt { font-family: var(--sans); font-weight: 400; }
.in:focus-visible, .chip:focus-visible, .tab:focus-visible, .btn:focus-visible, .x:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab {
  font: 600 15px/1 var(--display); letter-spacing: 0.01em; padding: 12px 16px; background: none; border: 0;
  border-bottom: 3px solid transparent; color: var(--muted); cursor: pointer; white-space: nowrap; margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 22px; }
.panel h2 { font: 600 18px/1.2 var(--display); margin: 0 0 4px; letter-spacing: 0.01em; }
.panel p.sub { margin: 0; color: var(--ink2); font-size: 14px; }

.inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; max-width: 520px; align-items: end; }
#time-block .inputs { max-width: 820px; }

/* result tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); }
.tile .lab { font: 500 12px/1.2 var(--sans); color: var(--ink2); }
.tile .num { font: 500 clamp(1.6rem, 4vw, 2.1rem)/1.15 var(--mono); margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .num small { font-size: 0.5em; color: var(--muted); margin-left: 4px; }
.tile.key { background: var(--accent-wash); border-color: transparent; }
.tile.key .num { color: var(--accent); }
.tile.bad { background: var(--warn-wash); border-color: transparent; }
.tile.bad .num { color: var(--warn); }

.block { display: flex; flex-direction: column; gap: 14px; padding-top: 20px; border-top: 1px solid var(--line); }
.block h3 { font: 600 15px/1.2 var(--display); margin: 0; letter-spacing: 0.01em; }
.readout { font: 400 14px/1.6 var(--sans); color: var(--ink2); margin: 0; }
.readout b { font-family: var(--mono); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.readout.warn { color: var(--warn); }
.readout.warn b { color: var(--warn); }

/* editable rows */
.rows { display: flex; flex-direction: column; gap: 10px; }
.row {
  display: grid; gap: 10px 12px; align-items: end; padding: 12px; border: 1px solid var(--line); border-radius: 8px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.row > * { min-width: 0; }
.row .name { grid-column: 1 / -1; }
.row .x { grid-column: 3; justify-self: end; }
.cmp-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cmp-row .x { grid-column: 2; }
.o .lab { display: block; font: 500 12px/1.3 var(--sans); color: var(--ink2); margin-bottom: 5px; }
.o .val { display: block; font: 500 16px/1.2 var(--mono); padding-block: 9px; font-variant-numeric: tabular-nums; }
.o.strong .val { color: var(--accent); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.x {
  font: 500 20px/1 var(--sans); width: 40px; height: 40px; border-radius: 6px; cursor: pointer;
  background: none; color: var(--muted); border: 1px solid var(--line);
}
.x:hover { color: var(--ink); border-color: var(--edge); }
.btn {
  align-self: flex-start; font: 500 14px/1 var(--sans); padding: 11px 14px; border-radius: 6px; cursor: pointer;
  background: var(--surface); color: var(--accent); border: 1px solid var(--accent);
}
.btn:hover { background: var(--accent-wash); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
@media (min-width: 760px) {
  .cmp-row { grid-template-columns: 110px 90px repeat(3, minmax(80px, 1fr)) 40px; }
  .cmp-row .x { grid-column: auto; }
}
@media (min-width: 960px) {
  .cum-row { grid-template-columns: minmax(130px, 1.3fr) 76px 66px 84px repeat(4, minmax(62px, 1fr)) 40px; }
  .cum-row .name { grid-column: auto; }
  .cum-row .x { grid-column: auto; }
}
.tag { font: 500 11px/1 var(--sans); color: var(--warn); }
.tile .rng { font: 400 12px/1.4 var(--mono); color: var(--ink2); margin-top: 6px; }
.exp { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.exp .msg { font-size: 13px; color: var(--ink2); }

/* langue */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 20px; }
.lang { display: flex; border: 1px solid var(--edge); border-radius: 6px; overflow: hidden; }
.lang button { font: 500 13px/1 var(--sans); padding: 9px 13px; background: var(--surface); color: var(--ink2); border: 0; cursor: pointer; }
.lang button + button { border-left: 1px solid var(--edge); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* scénarios et tests */
.scen-body { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.scen-body .sub { margin: 0; color: var(--ink2); font-size: 14px; }
.scen-body .msg { font-size: 13px; color: var(--ink2); }
.scen-body .scen-list { margin: 0; padding-left: 0; }
.scen-form { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; }
.scen-form .f { flex: 1 1 220px; max-width: 380px; }
.scen-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.scen-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.scen-list li.empty { color: var(--muted); border-style: dashed; }
.scen-list .nm { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; font-weight: 500; color: var(--ink); }
.scen-list .dt { font: 400 12px/1 var(--mono); color: var(--muted); }
.btn.sm { padding: 8px 11px; font-size: 13px; }
.btn.danger { color: var(--warn); border-color: var(--warn); }
.btn.danger:hover { background: var(--warn-wash); }
.test-sum { font-weight: 500; color: var(--ink); margin: 0; }
#test-out td:first-child { white-space: normal; min-width: 260px; }
table.vals td.pass { color: var(--accent); }
table.vals td.fail { color: var(--warn); font-weight: 500; }
textarea.exportbox {
  width: 100%; min-height: 150px; font: 400 12.5px/1.5 var(--mono); padding: 10px; border-radius: 6px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--edge); resize: vertical;
}

/* cumul bar */
.bar-wrap { position: relative; padding-top: 22px; }
.bar { display: flex; gap: 2px; height: 22px; }
.bar > i { display: block; border-radius: 3px; min-width: 2px; }
.bar > i.rest { background: var(--line); }
.limit { position: absolute; top: 0; bottom: -4px; width: 0; border-left: 2px solid var(--ink); }
.limit span { position: absolute; top: 0; transform: translateX(-50%); font: 500 11px/1 var(--mono); background: var(--surface); padding: 0 3px; white-space: nowrap; color: var(--ink); }
.limit.edge-r span { transform: translateX(-100%); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink2); }
.legend b { font-family: var(--mono); font-weight: 500; color: var(--ink); }

/* chart */
#chart { position: relative; }
#chart svg { display: block; width: 100%; touch-action: pan-y; }
#chart text { font: 400 11px var(--mono); fill: var(--ink2); }
.tip {
  position: absolute; pointer-events: none; z-index: 2; padding: 8px 10px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--edge); font: 400 12px/1.5 var(--mono); color: var(--ink);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14); white-space: nowrap;
}
.tip b { display: block; font-weight: 500; margin-bottom: 2px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.empty { color: var(--muted); }

table.vals { border-collapse: collapse; font: 400 13px/1.4 var(--mono); width: 100%; min-width: 520px; font-variant-numeric: tabular-nums; }
table.vals th, table.vals td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.vals th:first-child, table.vals td:first-child { text-align: left; }
table.vals th { color: var(--ink2); font-weight: 500; }
.scroll { overflow-x: auto; }
details summary { cursor: pointer; font-weight: 500; color: var(--accent); }
details.notes { color: var(--ink2); font-size: 14px; }
details.notes ul { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
@media (prefers-reduced-motion: no-preference) {
  .tile, .chip, .tab { transition: background-color 0.15s, color 0.15s, border-color 0.15s; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <div class="eyebrow" data-i18n="eyebrow"></div>
        <h1 data-i18n="title"></h1>
      </div>
      <div class="lang" role="group" aria-label="Langue / Language">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="formulas">
      <span><b>BED</b> = n · d · (1 + d / (α/β))</span>
      <span><b>EQD2</b> = BED / (1 + 2 / (α/β))</span>
    </div>
  </header>

  <section class="abstrip" aria-label="α/β">
    <div class="abfields">
      <div class="abfield">
        <label for="ab" data-i18n="ab.label"></label>
        <input id="ab" class="in" type="text" inputmode="decimal" value="3" autocomplete="off">
      </div>
      <div class="abfield u">
        <label for="ab-u" data-i18n="ab.u"></label>
        <input id="ab-u" class="in" type="text" inputmode="decimal" value="0" autocomplete="off">
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <p class="hint" data-i18n="ab.hint"></p>
  </section>

  <div>
    <div class="tabs" role="tablist" data-i18n-aria="tabs.aria">
      <button class="tab" role="tab" id="tab-conv" aria-controls="p-conv" aria-selected="true" data-tab="conversion" data-i18n="tab.conv"></button>
      <button class="tab" role="tab" id="tab-cum" aria-controls="p-cum" aria-selected="false" data-tab="cumul" data-i18n="tab.cum"></button>
      <button class="tab" role="tab" id="tab-cmp" aria-controls="p-cmp" aria-selected="false" data-tab="comparer" data-i18n="tab.cmp"></button>
    </div>

    <!-- Conversion -->
    <section class="panel" id="p-conv" role="tabpanel" aria-labelledby="tab-conv">
      <div>
        <h2 data-i18n="conv.h2"></h2>
        <p class="sub" data-i18n="conv.sub"></p>
      </div>
      <div class="inputs">
        <div class="f"><label for="c-d" data-i18n="conv.d"></label><input id="c-d" class="in" type="text" inputmode="decimal" value="2,67" autocomplete="off"></div>
        <div class="f"><label for="c-n" data-i18n="conv.n"></label><input id="c-n" class="in" type="text" inputmode="decimal" value="15" autocomplete="off"></div>
      </div>
      <div class="tiles">
        <div class="tile"><div class="lab" data-i18n="total"></div><div class="num"><span id="c-D">–</span><small>Gy</small></div></div>
        <div class="tile"><div class="lab">BED</div><div class="num"><span id="c-bed">–</span><small>Gy</small></div><div class="rng" id="c-bed-r" hidden></div></div>
        <div class="tile key"><div class="lab">EQD2</div><div class="num"><span id="c-eqd2">–</span><small>Gy</small></div><div class="rng" id="c-eqd2-r" hidden></div></div>
      </div>
      <div class="block">
        <h3 data-i18n="conv.iso.h3"></h3>
        <div class="inputs">
          <div class="f"><label for="c-dt" data-i18n="conv.dt"></label><input id="c-dt" class="in" type="text" inputmode="decimal" value="3" autocomplete="off"></div>
        </div>
        <p class="readout" id="c-iso">–</p>
        <p class="readout" id="c-round">–</p>
      </div>
      <div class="block" id="time-block">
        <h3 data-i18n="time.h3"></h3>
        <p class="readout" data-i18n="time.sub"></p>
        <div class="inputs">
          <div class="f"><label for="time-T" data-i18n="time.T"></label><input id="time-T" class="in" type="text" inputmode="decimal" value="" autocomplete="off"></div>
          <div class="f"><label for="time-tk" data-i18n="time.tk"></label><input id="time-tk" class="in" type="text" inputmode="decimal" value="" autocomplete="off"></div>
          <div class="f"><label for="time-tpot" data-i18n="time.tpot"></label><input id="time-tpot" class="in" type="text" inputmode="decimal" value="" autocomplete="off"></div>
          <div class="f"><label for="time-alpha" data-i18n="time.alpha"></label><input id="time-alpha" class="in" type="text" inputmode="decimal" value="" autocomplete="off"></div>
        </div>
        <p class="readout" id="time-hint"></p>
        <div class="tiles" id="time-out" hidden>
          <div class="tile"><div class="lab" data-i18n="time.loss"></div><div class="num"><span id="t-loss">–</span><small>Gy</small></div></div>
          <div class="tile"><div class="lab" data-i18n="time.bedc"></div><div class="num"><span id="t-bed">–</span><small>Gy</small></div></div>
          <div class="tile key"><div class="lab" data-i18n="time.eqdc"></div><div class="num"><span id="t-eqd2">–</span><small>Gy</small></div></div>
        </div>
      </div>
      <div class="exp"><button class="btn" type="button" data-copy="conv" data-i18n="copy.btn"></button><span class="msg" role="status"></span></div>
      <textarea class="exportbox" readonly hidden data-i18n-aria="copy.aria"></textarea>
    </section>

    <!-- Cumul -->
    <section class="panel" id="p-cum" role="tabpanel" aria-labelledby="tab-cum" hidden>
      <div>
        <h2 data-i18n="cum.h2"></h2>
        <p class="sub" data-i18n="cum.sub"></p>
      </div>
      <div class="rows" id="cum-rows"></div>
      <button class="btn" id="cum-add" type="button" data-i18n="cum.add"></button>
      <div class="tiles">
        <div class="tile"><div class="lab" data-i18n="cum.bedTot"></div><div class="num"><span id="cum-bed">–</span><small>Gy</small></div><div class="rng" id="cum-bed-r" hidden></div></div>
        <div class="tile key"><div class="lab" data-i18n="cum.eqdTot"></div><div class="num"><span id="cum-eqd2">–</span><small>Gy</small></div><div class="rng" id="cum-eqd2-r" hidden></div></div>
      </div>
      <div class="block">
        <h3 data-i18n="cum.margin.h3"></h3>
        <div class="inputs">
          <div class="f"><label for="cum-limit" data-i18n="cum.limit"></label><input id="cum-limit" class="in" type="text" inputmode="decimal" value="90" autocomplete="off"></div>
          <div class="f"><label for="cum-next" data-i18n="cum.next"></label><input id="cum-next" class="in" type="text" inputmode="decimal" value="2" autocomplete="off"></div>
        </div>
        <p class="sub" style="margin:0" data-i18n="cum.limitNote"></p>
        <div class="bar-wrap" id="cum-barwrap"><div class="bar" id="cum-bar"></div></div>
        <div class="legend" id="cum-legend"></div>
        <p class="readout" id="cum-rem">–</p>
      </div>
      <div class="exp"><button class="btn" type="button" data-copy="cumul" data-i18n="copy.btn"></button><span class="msg" role="status"></span></div>
      <textarea class="exportbox" readonly hidden data-i18n-aria="copy.aria"></textarea>
    </section>

    <!-- Comparaison -->
    <section class="panel" id="p-cmp" role="tabpanel" aria-labelledby="tab-cmp" hidden>
      <div>
        <h2 data-i18n="cmp.h2"></h2>
        <p class="sub" data-i18n="cmp.sub"></p>
      </div>
      <div class="rows" id="cmp-rows"></div>
      <button class="btn" id="cmp-add" type="button" data-i18n="cmp.add"></button>
      <p class="readout warn" id="cmp-note" hidden data-i18n="cmp.note"></p>
      <div class="legend" id="cmp-legend"></div>
      <div id="chart"></div>
      <details>
        <summary data-i18n="cmp.values"></summary>
        <div class="scroll" style="margin-top:10px"><table class="vals" id="cmp-table"></table></div>
      </details>
      <div class="exp"><button class="btn" type="button" data-copy="comparer" data-i18n="copy.btn"></button><span class="msg" role="status"></span></div>
      <textarea class="exportbox" readonly hidden data-i18n-aria="copy.aria"></textarea>
    </section>
  </div>

  <details class="notes scen" id="scen">
    <summary data-i18n="scen.sum"></summary>
    <div class="scen-body">

  /* Part récupérée saisie pour un traitement, entre 0 et 1 */
  function recOf(r) {

  function niceStep(maxv) {

  function drawChart() {
    var host = $('#chart');

    var narrow = W < 520, H = narrow ? 300 : 380;

      if (x1 > x0) g += '<rect x="' + x0 + '" y="' + m.t + '" width="' + (x1 - x0) + '" height="' + ph + '" style="fill:var(--accent);opacity:0.12"/>';
    }
    if (okAb(ab) && ab >= 1 && ab <= 15) {
      g += '<line x1="' + sx(ab) + '" x2="' + sx(ab) + '" y1="' + m.t + '" y2="' + sy(0) + '" style="stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3"/>' +
           '<text x="' + sx(ab) + '" y="' + (m.t - 6) + '" text-anchor="' + (ab > 12 ? 'end' : 'start') + '" style="fill:var(--accent)">' + esc(t('chart.chosen', { v: nf(ab, 2) + (uu > 0 ? ' ± ' + nf(uu, 2) : '') })) + '</text>';
    }
    series.forEach(function (s) {
      var d = s.pts.map(function (v, k) { return (k ? 'L' : 'M') + sx(xs[k]).toFixed(1) + ' ' + sy(v).toFixed(1); }).join('');
      g += '<path d="' + d + '" style="fill:none;stroke:var(--s' + ((s.i % 8) + 1) + ');stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>';
    });
    var labs = series.map(function (s) { return { s: s, y: sy(s.pts[s.pts.length - 1]) }; }).sort(function (p, q) { return p.y - q.y; });
    for (var k = 0; k < labs.length; k++) {
      if (labs[k].y < m.t + 4) labs[k].y = m.t + 4;
      if (k && labs[k].y - labs[k - 1].y < 13) labs[k].y = labs[k - 1].y + 13;
    }
    labs.forEach(function (l) {
      g += '<circle cx="' + (W - m.r + 8) + '" cy="' + (l.y - 3.5) + '" r="4" style="fill:var(--s' + ((l.s.i % 8) + 1) + ')"/>' +
           '<text x="' + (W - m.r + 16) + '" y="' + l.y + '">' + esc(nf(l.s.d, 2) + '×' + nf(l.s.n, 2)) + '</text>';
    });
    g += '<line class="cross" x1="0" x2="0" y1="' + m.t + '" y2="' + sy(0) + '" style="stroke:var(--ink2);stroke-width:1;display:none"/><g class="dots"></g>' +
         '<rect class="hit" x="' + m.l + '" y="' + m.t + '" width="' + pw + '" height="' + ph + '" style="fill:transparent"/>';
    host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(t('chart.aria')) + '">' + g + '</svg><div class="tip" hidden></div>';

    var svg = $('svg', host), tip = $('.tip', host), cross = $('.cross', svg), dots = $('.dots', svg);
    function hide() { tip.hidden = true; cross.style.display = 'none'; dots.innerHTML = ''; }
    function move(ev) {
      var r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * (W / r.width);
      if (x < m.l || x > W - m.r) { hide(); return; }
      var a = 1 + (x - m.l) / pw * 14; a = Math.min(15, Math.max(1, Math.round(a * 2) / 2));
      var px = sx(a);
      cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.style.display = '';
      dots.innerHTML = series.map(function (s) {
        return '<circle cx="' + px + '" cy="' + sy(eqd2(s.d, s.n, a)) + '" r="4" style="fill:var(--s' + ((s.i % 8) + 1) + ');stroke:var(--surface);stroke-width:2"/>';
      }).join('');
      tip.innerHTML = '<b>α/β = ' + nf(a, 1) + ' Gy</b>' + series.map(function (s) {
        return '<div><i style="background:var(--s' + ((s.i % 8) + 1) + ')"></i>' + esc(s.label) + ' : ' + nf(eqd2(s.d, s.n, a), 1) + ' Gy</div>';
      }).join('');
      tip.hidden = false;
      var tw = tip.offsetWidth, left = px * (r.width / W) + 12;
      if (left + tw > r.width) left = px * (r.width / W) - tw - 12;
      tip.style.left = Math.max(0, left) + 'px'; tip.style.top = (m.t + 4) + 'px';
    }
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerdown', move);
    svg.addEventListener('pointerleave', hide);
  }
  if (window.ResizeObserver) {
    new ResizeObserver(function () { var w = $('#chart').clientWidth; if (w && Math.abs(w - lastW) > 1) drawChart(); }).observe($('#chart'));
  } else {
    window.addEventListener('resize', drawChart);
  }

  /* ---------- Résumé copiable ---------- */
  function stamp() {
    return t('sum.stamp', { date: new Date().toLocaleDateString(locale()) });
  }
  function abLine() {
    var u = getU();
    return 'α/β = ' + nf(getAb(), 2) + ' Gy' + (u > 0 ? ' (± ' + nf(u, 2) + ' Gy)' : '');
  }
  function summaryConv() {
    var ab = getAb(), d = parse($('#c-d').value), n = parse($('#c-n').value);
    if (!okAb(ab) || !okPos(d) || !okPos(n)) return null;
    var B = bed(d, n, ab);
    var L = [t('sum.conv.title'), abLine(), t('sum.regimen', { d: nf(d, 2), n: nf(n, 2), D: nf(d * n, 2) }),
      t('sum.bed', { v: nf(B, 1) }), t('sum.eqd2', { v: nf(eqd2(d, n, ab), 1) })];
    if (!$('#c-bed-r').hidden) L.push(t('sum.rangeBed', { v: $('#c-bed-r').textContent }));
    if (!$('#c-eqd2-r').hidden) L.push(t('sum.rangeEqd', { v: $('#c-eqd2-r').textContent }));
    var tc = timeCalc(B, ab);
    if (tc) L.push(t('sum.time', { T: nf(tc.T, 1), tk: nf(tc.tk, 1), tpot: nf(tc.tp, 1), a: nf(tc.al, 3), loss: nf(tc.loss, 1), bed: nf(tc.bed, 1), eqd: nf(tc.eqd2, 1) }));
    var iso = $('#c-iso').textContent, rd = $('#c-round').textContent;
    if (iso && rd) L.push('', iso, rd);
    L.push('', t('sum.formulas'), stamp());
    return L.join('\n');
  }
  function summaryCum() {
    var ab = getAb();
    if (!okAb(ab)) return null;
    var s = cumTotals(ab);
    if (!s.k) return null;
    var L = [t('sum.cum.title'), abLine(), ''];
    cum.forEach(function (r, i) {
      var d = parse(r.d), n = parse(r.n);
      if (!okPos(d) || !okPos(n)) return;
      var E = eqd2(d, n, ab), rec = recOf(r);
      L.push(t('sum.cum.line', { name: cumName(r, i), d: nf(d, 2), n: nf(n, 2), D: nf(d * n, 2), B: nf(bed(d, n, ab), 1), E: nf(E, 1) }) +
        (rec > 0 ? t('sum.cum.rec', { p: nf(rec * 100, 0), C: nf(E * (1 - rec), 1) }) : ''));
    });
    L.push('', t('sum.cum.bed', { v: nf(s.B, 1) }), t('sum.cum.eqd', { v: nf(s.E, 1) }));
    if (!$('#cum-eqd2-r').hidden) L.push(t('sum.cum.range', { v: $('#cum-eqd2-r').textContent }));
    L.push($('#cum-rem').textContent, '', t('sum.formulas'), stamp());
    return L.join('\n');
  }
  function summaryCmp() {
    var ab = getAb();
    if (!okAb(ab) || !series.length) return null;
    var L = [t('sum.cmp.title'), abLine(), ''], high = false;
    series.forEach(function (s) {
      if (s.d > 8) high = true;
      L.push(t('sum.cmp.line', { label: s.label, D: nf(s.d * s.n, 2), B: nf(bed(s.d, s.n, ab), 1), E: nf(eqd2(s.d, s.n, ab), 1) }) + (s.d > 8 ? ' (†)' : ''));
    });
    if (high) L.push('', t('sum.dagger'));
    L.push('', t('sum.formulas'), stamp());
    return L.join('\n');
  }
  var SUMMARY = { conv: summaryConv, cumul: summaryCum, comparer: summaryCmp };
  $$('[data-copy]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var panel = btn.closest('.panel'), msg = $('.msg', panel), box = $('.exportbox', panel);
      var text = SUMMARY[btn.dataset.copy]();
      if (!text) { msg.textContent = t('copy.invalid'); return; }
      box.value = text;
      var fallback = function () {
        box.hidden = false; box.focus(); box.select();
        msg.textContent = t('copy.fallback');
      };
      try {
        if (!navigator.clipboard || !navigator.clipboard.writeText) { fallback(); return; }
        navigator.clipboard.writeText(text).then(function () {
          box.hidden = true; msg.textContent = t('copy.ok');
        }, fallback);
      } catch (e) { fallback(); }
    });
  });

  /* ---------- Scénarios enregistrés dans le navigateur ---------- */
  var currentTab = 'conversion';
  var memScen = null;
  function validScen(s) { return s && typeof s.id === 'string' && typeof s.name === 'string' && s.state && typeof s.state === 'object'; }
  function loadScen() {
    var raw = storeGet(STORE_KEY);
    if (raw == null) return memScen || [];
    try { var a = JSON.parse(raw); return Array.isArray(a) ? a.filter(validScen) : []; } catch (e) { return []; }
  }
  function saveScen(list) { memScen = list; return storeSet(STORE_KEY, JSON.stringify(list)); }
  function getState() {
    var g = function (id) { return $(id).value; };
    return {
      v: 1, ab: g('#ab'), u: g('#ab-u'),
      conv: { d: g('#c-d'), n: g('#c-n'), dt: g('#c-dt'), T: g('#time-T'), tk: g('#time-tk'), tpot: g('#time-tpot'), alpha: g('#time-alpha') },
      cum: cum.map(function (r, i) { return { name: cumName(r, i), d: r.d, n: r.n, rec: r.rec }; }),
      cumLimit: g('#cum-limit'), cumNext: g('#cum-next'),
      cmp: cmp.map(function (r) { return { d: r.d, n: r.n }; }),
      tab: currentTab
    };
  }
  var sstr = function (x, def) { return (typeof x === 'string' || typeof x === 'number') ? String(x).slice(0, 60) : def; };
  function setState(s) {
    var c = s.conv || {}, set = function (id, v) { $(id).value = v; };
    set('#ab', sstr(s.ab, '3')); set('#ab-u', sstr(s.u, '0'));
    set('#c-d', sstr(c.d, '2')); set('#c-n', sstr(c.n, '15')); set('#c-dt', sstr(c.dt, '3'));
    set('#time-T', sstr(c.T, '')); set('#time-tk', sstr(c.tk, '')); set('#time-tpot', sstr(c.tpot, '')); set('#time-alpha', sstr(c.alpha, ''));
    set('#cum-limit', sstr(s.cumLimit, '90')); set('#cum-next', sstr(s.cumNext, '2'));
    cum = (Array.isArray(s.cum) ? s.cum : []).slice(0, 8).map(function (r) {
      return { uid: ++uid, name: sstr(r && r.name, ''), d: sstr(r && r.d, '2'), n: sstr(r && r.n, '1'), rec: sstr(r && r.rec, '0') };
    });
    cmp = (Array.isArray(s.cmp) ? s.cmp : []).slice(0, 8).map(function (r) {
      return { uid: ++uid, d: sstr(r && r.d, '2'), n: sstr(r && r.n, '1') };
    });
    localizeNumbers(); renderCumRows(); renderCmpRows(); updateAll();
    showTab(TABS[s.tab] ? s.tab : 'conversion');
  }
  var fmtDate = function (ts) {
    try { return new Date(ts).toLocaleString(locale(), { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return ''; }
  };
  function renderScen() {
    var list = loadScen();
    $('#scen-list').innerHTML = list.length ? list.map(function (s) {
      return '<li data-id="' + esc(s.id) + '"><span class="nm">' + esc(s.name) + '</span><span class="dt">' + esc(fmtDate(s.ts)) + '</span>' +
        '<button type="button" class="btn sm" data-act="load">' + esc(t('scen.load')) + '</button>' +
        '<button type="button" class="btn sm danger" data-act="del">' + esc(t('scen.del')) + '</button></li>';
    }).join('') : '<li class="empty">' + esc(t('scen.empty')) + '</li>';
  }
  $('#scen-save').addEventListener('click', function () {
    var list = loadScen(), msg = $('#scen-msg');
    if (list.length >= 20) { msg.textContent = t('scen.full'); return; }
    var name = $('#scen-name').value.trim() || t('scen.default', { n: list.length + 1 });
    list.unshift({ id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: name.slice(0, 60), ts: Date.now(), state: getState() });
    saveScen(list);
    $('#scen-name').value = '';
    msg.textContent = t('scen.saved', { name: name.slice(0, 60) });
    renderScen();
  });
  $('#scen-list').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var li = b.closest('li'), id = li.dataset.id, msg = $('#scen-msg');
    var list = loadScen(), s = list.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    if (b.dataset.act === 'load') {
      try { setState(s.state); msg.textContent = t('scen.loaded', { name: s.name }); } catch (err) { msg.textContent = t('scen.badload'); }
    } else if (b.dataset.armed) {
      saveScen(list.filter(function (x) { return x.id !== id; }));
      msg.textContent = t('scen.deleted');
      renderScen();
    } else {
      b.dataset.armed = '1'; b.textContent = t('scen.confirm');
      setTimeout(function () { if (b.isConnected) { delete b.dataset.armed; b.textContent = t('scen.del'); } }, 3000);
    }
  });

  /* ---------- Tests intégrés ---------- */
  function runTests() {
    var cases = [
      ['test.c1', bed(2, 30, 10), 72],
      ['test.c2', eqd2(2, 30, 10), 60],
      ['test.c3', bed(3, 10, 3), 60],
      ['test.c4', eqd2(3, 10, 3), 36],
      ['test.c5', eqd2(2.67, 15, 3), 45.4167],
      ['test.c6', bed(20, 1, 10), 60],
      ['test.c7', doseFromBed(60, 2, 3), 36],
      ['test.c8', eqd2(2, 30, 1.5), 60],
      ['test.c9', repopLoss(0.3, 5, 21, 42), 9.7041],
      ['test.c10', cumSumRows([{ d: '2', n: '25', rec: '50' }, { d: '3', n: '8', rec: '0' }], 3).E, 53.8],
      ['test.c11', eqd2(3, 10, 10), 32.5],
      ['test.c12', repopLoss(0.3, 5, 21, 21), 0]
    ];
    var okCount = 0;
    var rows = cases.map(function (c) {
      var pass = Math.abs(c[1] - c[2]) < 0.001;
      if (pass) okCount++;
      return '<tr><td>' + esc(t(c[0])) + '</td><td>' + nf(c[2], 4) + '</td><td>' + nf(c[1], 4) + '</td><td class="' + (pass ? 'pass' : 'fail') + '">' + esc(pass ? '✓ ' + t('test.ok') : '✗ ' + t('test.ko')) + '</td></tr>';
    });
    $('#test-out').innerHTML = '<thead><tr><th>' + esc(t('test.case')) + '</th><th>' + esc(t('test.exp')) + '</th><th>' + esc(t('test.got')) + '</th><th>' + esc(t('test.res')) + '</th></tr></thead><tbody>' + rows.join('') + '</tbody>';
    $('#test-sum').textContent = t('test.total', { ok: okCount, n: cases.length });
    return { ok: okCount, n: cases.length };
  }
  window.__tests = runTests;
  $('#tests').addEventListener('toggle', function () { if (this.open) runTests(); });

  /* ---------- Onglets ---------- */
  var TABS = { conversion: ['tab-conv', 'p-conv'], cumul: ['tab-cum', 'p-cum'], comparer: ['tab-cmp', 'p-cmp'] };
  function showTab(key, keepHash) {
    currentTab = key;
    Object.keys(TABS).forEach(function (k) {
      var on = k === key;
      $('#' + TABS[k][0]).setAttribute('aria-selected', String(on));
      $('#' + TABS[k][1]).hidden = !on;
    });
    if (!keepHash) { try { history.replaceState(null, '', '#' + key); } catch (e) {} }
    if (key === 'comparer') drawChart();
  }
  $$('.tab').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });

  function updateAll() { syncChips(); updConv(); updCum(); updCmp(); }

  /* ---------- Changement de langue ---------- */
  function setLang(l) {
    if (l === LANG || !DICT[l]) return;
    LANG = l; storeSet(LANG_KEY, l);
    applyStatic(); buildChips(); localizeNumbers(); renderCumRows(); renderCmpRows(); updateAll(); renderScen();
    $$('.msg').forEach(function (m) { m.textContent = ''; });
    $$('.exportbox').forEach(function (b) { b.hidden = true; });
    if ($('#tests').open) runTests();
  }
  $$('[data-lang]').forEach(function (b) { b.addEventListener('click', function () { setLang(b.dataset.lang); }); });

  /* ---------- Démarrage ---------- */
  var savedLang = storeGet(LANG_KEY), nav = String(navigator.language || 'fr').toLowerCase();
  LANG = (savedLang === 'en' || savedLang === 'fr') ? savedLang : (nav.indexOf('fr') === 0 ? 'fr' : (nav.indexOf('en') === 0 ? 'en' : 'fr'));
  applyStatic(); buildChips();
  if (LANG !== 'fr') localizeNumbers();
  renderCumRows(); renderCmpRows(); updateAll(); renderScen();
  $('#scen-nostore').hidden = storageOK;
  var h = (location.hash || '').replace('#', '');
  if (TABS[h]) showTab(h, true);
})();
</script>
</body>
